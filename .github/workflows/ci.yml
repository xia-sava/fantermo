name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 配布物を作るワークフローが、組む前の検証として呼ぶ。
  workflow_call: {}

# 既定では GITHUB_TOKEN に何の権限も与えない。必要なジョブが必要な分だけ宣言する。
permissions: {}

# 同じ参照への連続 push では最新のものだけ検証する。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      # 取ってきた crate と target/ を残しておき、依存が変わらなければ libghostty-vt を組み直さない。
      - uses: Swatinem/rust-cache@v2

      # tools/dev.bat が vcvars64 を読み、Zig のバージョンを確かめてから cargo を呼ぶ（手元と同じ手順）。
      - name: Check formatting
        shell: cmd
        run: call tools\dev.bat fmt --all --check

      - name: Clippy
        shell: cmd
        run: call tools\dev.bat clippy --locked --all-targets -- -D warnings

      - name: Test
        shell: cmd
        run: call tools\dev.bat test --locked

  # ブリッジ（crates/fantermo-bridge）は workspace の外にあり、上の fmt・clippy は見ない。Cygwin と Linux（musl）
  # 向けに、手元と同じ tools/bridge.sh で確かめる。プロトコルの crate のテストは上の test で実行する。
  bridge:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/setup-bridge-toolchain

      # ブリッジは自分の Cargo.lock を持ち、出力先は tools/bridge.sh が決める target/bridge/。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fantermo-bridge -> ../../target/bridge

      - name: Check formatting
        shell: bash
        run: ./tools/bridge.sh fmt --check

      - name: Clippy
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: ./tools/bridge.sh clippy all -- -D warnings

      - name: Build
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: ./tools/bridge.sh build all

  # 実際の fantermo を別デスクトップで起動して、制御の口（feature e2e）で確かめる。出力先は tools/dev.bat が決める
  # target/e2e/。Smoke は別デスクトップと Direct3D がランナーで動くかだけを確かめ、ログをそのまま出す。
  # TODO: GitHub Actions で 3 つの e2e のジョブ（e2e-conpty、e2e-cygwin、bridge-linux）が通ることを確かめたら
  # continue-on-error を外す。配布のワークフローがこの CI を呼ぶので、付いている間は落ちても配布を止めない。
  e2e-conpty:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/e2e

      # run-hidden も作る（--test e2e だけでは作らない）。
      - name: Build
        shell: cmd
        run: call tools\dev.bat build --locked --features e2e

      - name: Smoke
        shell: cmd
        run: call tools\dev.bat test --locked --features e2e --test e2e smoke -- --nocapture

      - name: E2E
        shell: cmd
        run: call tools\dev.bat test --locked --features e2e --test e2e

      - name: Clippy
        shell: cmd
        run: call tools\dev.bat clippy --locked --features e2e --all-targets -- -D warnings

  # Cygwin のブリッジの単体のテストと e2e。
  e2e-cygwin:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - id: toolchain
        uses: ./.github/actions/setup-bridge-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target/e2e
            crates/fantermo-bridge -> ../../target/bridge

      - name: Bridge tests
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: ./tools/bridge.sh test cygwin

      - name: Build the bridge
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: ./tools/bridge.sh build cygwin

      - name: Build
        shell: cmd
        run: call tools\dev.bat build --locked --features e2e

      - name: E2E
        shell: cmd
        env:
          FANTERMO_E2E_CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: call tools\dev.bat test --locked --features e2e --test e2e cygwin

  # Linux 向けのブリッジの単体のテスト。パイプでつないで名乗り・リサイズ・データ・終了をやり取りする。
  bridge-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fantermo-bridge -> ../../target/bridge

      - name: Bridge tests
        run: ./tools/bridge.sh test linux
