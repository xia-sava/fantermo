name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 配布物を作るワークフローが、組む前の検証として呼ぶ。
  workflow_call: {}

# 既定では GITHUB_TOKEN に何の権限も与えない。必要なジョブが必要な分だけ宣言する。
permissions: {}

# 同じ参照への連続 push では最新のものだけ検証する。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      # 取ってきた crate と target/ を残しておき、依存が変わらなければ libghostty-vt を組み直さない。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # tools/dev.bat が vcvars64 を読み、Zig のバージョンを確認してから cargo を呼ぶ（手元と同じ手順）。
      - name: Check formatting
        shell: cmd
        run: call tools\dev.bat fmt --all --check

      - name: Clippy
        shell: cmd
        run: call tools\dev.bat clippy --locked --all-targets -- -D warnings

      - name: Test
        shell: cmd
        run: call tools\dev.bat test --locked

  # ブリッジ（crates/fantermo-bridge）は workspace の外にあり、上の fmt・clippy は見ない。Cygwin と Linux（musl）
  # 向けに、手元と同じ tools/bridge.sh で確認する。プロトコルの crate のテストは上の test で実行する。
  bridge:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/setup-bridge-toolchain

      # ブリッジは自分の Cargo.lock を持ち、出力先は tools/bridge.sh が決める target/bridge/。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/fantermo-bridge -> ../../target/bridge

      - name: Check formatting
        shell: bash
        run: ./tools/bridge.sh fmt --check

      - name: Clippy
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: ./tools/bridge.sh clippy all -- -D warnings

      - name: Build
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: ./tools/bridge.sh build all

  # 実際の fantermo を別デスクトップで起動して、制御の口（feature e2e）で確認する。出力先は tools/dev.bat が決める
  # target/e2e/。Smoke は別デスクトップと Direct3D がランナーで動くかだけを確認し、ログをそのまま出す。
  e2e-conpty:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target/e2e

      # run-hidden も作る（--test e2e だけでは作らない）。
      - name: Build
        shell: cmd
        run: call tools\dev.bat build --locked --features e2e

      - name: Clippy
        shell: cmd
        run: call tools\dev.bat clippy --locked --features e2e --all-targets -- -D warnings

      # 失敗したテストの一時フォルダ（fantermo のログ、config.toml、state.toml など）は FANTERMO_E2E_KEEP_FAILED の
      # 下へ写り、最後のステップが成果物として残す。
      - name: Smoke
        shell: cmd
        env:
          FANTERMO_E2E_KEEP_FAILED: ${{ runner.temp }}/e2e-failed
        run: call tools\dev.bat test --locked --features e2e --test e2e smoke -- --nocapture

      # OS のクリップボードを実際に変えるテストと、OS のファイルを選ぶダイアログで選ぶテストも実行する（ランナーの
      # クリップボードとダイアログの履歴は誰も使っていない）。
      - name: E2E
        shell: cmd
        env:
          FANTERMO_E2E_OS_CLIPBOARD: "1"
          FANTERMO_E2E_FILE_DIALOG: "1"
          FANTERMO_E2E_KEEP_FAILED: ${{ runner.temp }}/e2e-failed
        run: call tools\dev.bat test --locked --features e2e --test e2e

      # 失敗を調べ終わるまで残ればよい。名前にやり直しの回を付ける（同じ実行の中で名前は重ねられない）。
      - name: Keep the folders of the failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-conpty-failed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-failed
          if-no-files-found: ignore
          retention-days: 7

  # Cygwin のブリッジの単体のテストと e2e。
  e2e-cygwin:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - id: toolchain
        uses: ./.github/actions/setup-bridge-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target/e2e
            crates/fantermo-bridge -> ../../target/bridge

      - name: Bridge tests
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: ./tools/bridge.sh test cygwin

      - name: Build the bridge
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: ./tools/bridge.sh build cygwin

      - name: Build
        shell: cmd
        run: call tools\dev.bat build --locked --features e2e

      - name: E2E
        shell: cmd
        env:
          FANTERMO_E2E_CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
          FANTERMO_E2E_OS_CLIPBOARD: "1"
          FANTERMO_E2E_KEEP_FAILED: ${{ runner.temp }}/e2e-failed
        run: call tools\dev.bat test --locked --features e2e --test e2e cygwin

      # e2e-conpty の同じ名前のステップと同じ。
      - name: Keep the folders of the failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cygwin-failed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-failed
          if-no-files-found: ignore
          retention-days: 7

  # Linux 向けのブリッジの単体のテスト。パイプで接続して開始の通知・リサイズ・データ・終了をやり取りする。
  bridge-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/fantermo-bridge -> ../../target/bridge

      - name: Bridge tests
        run: ./tools/bridge.sh test linux
