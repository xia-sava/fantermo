name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# 既定では GITHUB_TOKEN に何の権限も与えない。必要なジョブが必要な分だけ宣言する。
permissions: {}

# 連続して打ったタグを取りこぼさないよう、キャンセルせず順に流す。
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.compute.outputs.name }}
      cargo: ${{ steps.compute.outputs.cargo }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # バージョンはタグ名から v を除いたもの。Cargo のバージョン（Cargo.toml の [workspace.package] の
      # version）と食い違えば止める。食い違ったまま配ると、アプリが見せるバージョンと配布物のバージョンが
      # 合わなくなる。配布しない手動実行は識別できる名前を付ける。MSI のバージョンには名前ではなく Cargo の
      # バージョンを使う。
      - name: Compute version
        id: compute
        run: |
          set -euo pipefail
          cargo_version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml)
          if [ -z "$cargo_version" ]; then
            echo "Cargo.toml の [workspace.package] に version が見つかりません" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            # MSI のバージョンは major.minor.patch しか受け付けないため、接尾辞つきのタグも弾く。
            if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "タグは vMAJOR.MINOR.PATCH の形で打つこと（受け取った値: $GITHUB_REF_NAME）" >&2
              exit 1
            fi
            if [ "$name" != "$cargo_version" ]; then
              echo "タグ（$GITHUB_REF_NAME）と Cargo のバージョン（$cargo_version）が食い違っています" >&2
              exit 1
            fi
          else
            name="dev-$(git rev-parse --short HEAD)"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "cargo=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "version=$name (Cargo: $cargo_version)"

  # 配布物を作る前に fmt・clippy・test を通す。ここが失敗すればリリースまで進まない。
  check:
    needs: [version]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # ブリッジを Cygwin と Linux（musl）向けにリリースのビルドで組み、build ジョブへ渡す。
  build-bridge:
    needs: [check]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/setup-bridge-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fantermo-bridge -> ../../target/bridge

      - name: Build
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.toolchain.outputs.cygwin-root }}
        run: ./tools/bridge.sh build all --release

      # git bash の cp は、拡張子のない名前への書き込みを同じ名前の .exe へ向けることがあるので使わない。
      - name: Collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/bridge | Out-Null
          Copy-Item target/bridge/x86_64-pc-cygwin/release/fantermo-bridge.exe artifacts/bridge/
          Copy-Item target/bridge/x86_64-unknown-linux-musl/release/fantermo-bridge artifacts/bridge/

      # build ジョブが zip と MSI に詰めるまで残ればよい。
      - uses: actions/upload-artifact@v7
        with:
          name: bridge
          path: artifacts/bridge/
          if-no-files-found: error
          retention-days: 1

  # 手動実行でも組む。配布はしないが、手元で試すための zip と MSI を成果物として残す。
  build:
    needs: [version, check, build-bridge]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      # 取ってきた crate と target/ を残しておき、依存が変わらなければ libghostty-vt を組み直さない。
      - uses: Swatinem/rust-cache@v2

      # タグを打ったときだけリリースのビルドとしてバージョンを見せる（手動実行は 0.0.1 (dev-<短い SHA>)）。
      - name: Build
        shell: cmd
        env:
          FANTERMO_RELEASE: ${{ github.ref_type == 'tag' && '1' || '0' }}
        run: call tools\dev.bat build --release --locked -p fantermo

      - uses: actions/download-artifact@v8
        with:
          name: bridge
          path: ${{ runner.temp }}/bridge

      # fantermo はブリッジを exe と同じフォルダから探すので、並べて置く。
      - name: Pack zip
        shell: pwsh
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: |
          $name = "fantermo-$env:VERSION_NAME-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          $bridge = Join-Path $env:RUNNER_TEMP 'bridge'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\fantermo.exe $stage
          Copy-Item (Join-Path $bridge 'fantermo-bridge.exe'), (Join-Path $bridge 'fantermo-bridge') $stage
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt, README.md $stage
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path $stage -DestinationPath "artifacts/$name.zip"

      # zip に詰めたのと同じフォルダから MSI を組む。WiX は .config/dotnet-tools.json でバージョンを固定して
      # 入れる。
      # WiX 7 は OSMF の EULA への同意がないとどのコマンドも止まるので、ランナーのユーザーとして一度
      # 同意しておき、build には -acceptEula も付ける。
      # 画面は UI の拡張（WixToolset.UI.wixext）で組む。拡張のバージョンは WiX と同じものに固定し、
      # 作業ツリーの .wix/extensions に入れる。文は ja-JP のローカライズと installer/fantermo.ja-JP.wxl。
      - name: Pack msi
        shell: pwsh
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          CARGO_VERSION: ${{ needs.version.outputs.cargo }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "fantermo-$env:VERSION_NAME-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          $wixVersion = (Get-Content .config/dotnet-tools.json -Raw | ConvertFrom-Json).tools.wix.version
          $uiExtension = "WixToolset.UI.wixext/$wixVersion"
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore が失敗しました（$LASTEXITCODE）" }
          dotnet tool run wix eula accept wix7
          if ($LASTEXITCODE -ne 0) { throw "wix eula accept が失敗しました（$LASTEXITCODE）" }
          dotnet tool run wix extension add $uiExtension
          if ($LASTEXITCODE -ne 0) { throw "wix extension add $uiExtension が失敗しました（$LASTEXITCODE）" }
          dotnet tool run wix build -acceptEula wix7 -arch x64 `
            -ext $uiExtension `
            -culture ja-JP `
            -loc installer/fantermo.ja-JP.wxl `
            -d "Version=$env:CARGO_VERSION" `
            -d "StageDir=$stage" `
            -d "IconFile=$(Join-Path $env:GITHUB_WORKSPACE 'assets\icon\fantermo.ico')" `
            -o "artifacts/$name.msi" installer/fantermo.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build が失敗しました（$LASTEXITCODE）" }
          # wix build は ICE の検証をしないので、別に実行する。エラーがあれば止める。
          dotnet tool run wix msi validate "artifacts/$name.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix msi validate が失敗しました（$LASTEXITCODE）" }

      # タグを打ったときの配布物はリリースへ載るため、保持期間は release ジョブへ渡すまででよい。
      # 手動実行の配布物は成果物としてしか残らないため、手元へダウンロードするまでの猶予を置く。
      # Actions のストレージ枠はアカウント全体で共有していて、既定の 90 日で抱え続けると
      # 他のリポジトリの CI まで止まる。
      - uses: actions/upload-artifact@v7
        with:
          name: zip
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 1 || 3 }}

      - uses: actions/upload-artifact@v7
        with:
          name: msi
          path: artifacts/*.msi
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 1 || 3 }}

  # 配布物の照合値から latest.json を組み、署名する。公開の権限は持たず、成果物として release へ渡す。
  # 署名鍵を持つのはこのジョブだけで、リリースを書き換える権限とは同居させない。
  manifest:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # tools/manifest.sh と、アプリに埋め込む公開鍵 assets/manifest-public-key.der を使う。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # アプリが取得する latest.json。配布物は latest に固定の名前で置くので、その名前で照合値を採る。
      - name: Write latest.json
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p latest
          cp "artifacts/fantermo-${VERSION_NAME}-x64.zip" latest/fantermo.zip
          cp "artifacts/fantermo-${VERSION_NAME}-x64.msi" latest/fantermo.msi
          ./tools/manifest.sh write "$VERSION_NAME" \
            "https://github.com/${REPOSITORY}/releases/download/latest" \
            latest/latest.json zip=latest/fantermo.zip msi=latest/fantermo.msi
          cat latest/latest.json

      # latest.json の生バイトへ署名し、リポジトリの公開鍵で確かめる。アプリは署名を確かめてからで
      # ないと latest.json を解釈しない。鍵は環境変数で受け取り、権限を絞った一時ファイルへ書いて使い、
      # ステップを抜けるときに消す。引数へ載せるとプロセス一覧から読める。
      - name: Sign latest.json
        env:
          SIGNING_KEY: ${{ secrets.FANTERMO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "FANTERMO_SIGNING_KEY が未設定です" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/manifest-signing-key.pem"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key_file")
          ./tools/manifest.sh sign latest/latest.json "$key_file" assets/manifest-public-key.der

      # latest.json もリリースへ載るため、保持期間は release ジョブへ渡すまででよい。
      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: |
            latest/latest.json
            latest/latest.json.sig
          if-no-files-found: error
          retention-days: 1

  # 成果物を公開するだけのジョブ。contents: write を持つのはここだけ。
  release:
    if: github.ref_type == 'tag'
    needs: [version, build, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Name the files for latest
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p latest
          cp "artifacts/fantermo-${VERSION_NAME}-x64.zip" latest/fantermo.zip
          cp "artifacts/fantermo-${VERSION_NAME}-x64.msi" latest/fantermo.msi
          cp artifacts/latest.json artifacts/latest.json.sig latest/
          # latest.json の照合値と、latest に置く配布物が同じものであることを確かめる。
          # アプリは msi の照合値でダウンロードした MSI を確かめる。
          for kind in zip msi; do
            expected=$(jq -r ".${kind}.sha256" latest/latest.json)
            actual=$(sha256sum "latest/fantermo.${kind}" | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "latest.json の sha256 と ${kind} が合いません" >&2
              exit 1
            fi
          done

      # バージョンごとのリリース。配布物の実物が残るので、後からどのバージョンで何を配ったかを辿れる。
      # 配布物を書き込む唯一の外部コードなので、可変タグではなくコミットで固定する。
      - name: Publish versioned release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.version.outputs.name }}
          body: |
            fantermo ${{ needs.version.outputs.name }}

            MSI を開いて「インストール」をクリックすると、ユーザー単位で %LOCALAPPDATA%\Programs\fantermo にインストールする（管理者権限は不要）。
            スタートメニューの fantermo から起動する。アプリの中から更新できるのは MSI でインストールしたバージョンだけ。

            zip は、展開して中の fantermo.exe を起動する。
          files: |
            artifacts/fantermo-${{ needs.version.outputs.name }}-x64.msi
            artifacts/fantermo-${{ needs.version.outputs.name }}-x64.zip

      # 更新の取得先。アプリは latest から latest.json と配布物を取得するため、置き場を動かさずに
      # 中身だけ差し替える。
      - name: Update latest release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            配布中のバージョン（${{ needs.version.outputs.name }}）。
          prerelease: true
          files: |
            latest/fantermo.msi
            latest/fantermo.zip
            latest/latest.json
            latest/latest.json.sig
