name: Set up the bridge toolchain
description: >-
  ブリッジ（crates/fantermo-bridge）のビルドに要るものを入れる。Linux（musl）向けは Rust の stable と
  ターゲット、Cygwin 向けは nightly（rust-src と clippy）と、リンカの gcc を持つ Cygwin。

outputs:
  cygwin-root:
    description: 入れた Cygwin のフォルダ（tools/bridge.sh の CYGWIN_ROOT に渡す）
    value: ${{ steps.cygwin.outputs.root || steps.cygwin-second.outputs.root || steps.cygwin-third.outputs.root }}

runs:
  using: composite
  steps:
    # nightly の日付は tools/bridge.sh の既定（BRIDGE_NIGHTLY がないときに使うもの）から読む。
    - name: Install Rust
      shell: bash
      run: |
        set -euo pipefail
        nightly=$(sed -n 's/^nightly="\${BRIDGE_NIGHTLY:-\(.*\)}"$/\1/p' tools/bridge.sh)
        if [ -z "$nightly" ]; then
          echo "tools/bridge.sh から nightly の既定が読めません" >&2
          exit 1
        fi
        rustup update stable --no-self-update
        rustup default stable
        rustup component add clippy rustfmt
        rustup target add x86_64-unknown-linux-musl
        rustup toolchain install "$nightly" --profile minimal --component rust-src --component clippy --no-self-update

    # Cygwin の bin はジョブの PATH に足さない（git bash の MSYS のコマンドとぶつかるため）。tools/bridge.sh は
    # CYGWIN_ROOT からリンカのパスを組み立て、cargo を実行する間だけその bin を PATH の先頭に置く。
    #
    # action はインストーラを毎回 https://cygwin.com/ から取得し（1 分ほどのあいだに 5 回試す）、取得先を変える入力も、
    # 取得したものを使い回す入力も持たない。cygwin.com が数分応えないことがあるので、失敗したら間を置いて action
    # ごとやり直す（合わせて 3 回）。
    - name: Install Cygwin
      id: cygwin
      continue-on-error: true
      uses: cygwin/cygwin-install-action@5a1b0cd107181fa6bb6bf3f90d500f4fb3132f18 # v7.0.0
      with:
        packages: gcc-core
        add-to-path: false

    - name: Wait before installing Cygwin again
      if: steps.cygwin.outcome == 'failure'
      shell: bash
      run: sleep 60

    - name: Install Cygwin (second attempt)
      id: cygwin-second
      if: steps.cygwin.outcome == 'failure'
      continue-on-error: true
      uses: cygwin/cygwin-install-action@5a1b0cd107181fa6bb6bf3f90d500f4fb3132f18 # v7.0.0
      with:
        packages: gcc-core
        add-to-path: false

    - name: Wait before installing Cygwin for the last time
      if: steps.cygwin-second.outcome == 'failure'
      shell: bash
      run: sleep 120

    - name: Install Cygwin (last attempt)
      id: cygwin-third
      if: steps.cygwin-second.outcome == 'failure'
      uses: cygwin/cygwin-install-action@5a1b0cd107181fa6bb6bf3f90d500f4fb3132f18 # v7.0.0
      with:
        packages: gcc-core
        add-to-path: false
