[workspace]
resolver = "3"
members = ["crates/fantermo", "crates/fantermo-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
fantermo-core = { path = "crates/fantermo-core" }
# `rev` を書き換えて上げる。そのコミットが求める Zig の版は tools/dev.bat の ZIG_REQUIRED と揃える。
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "9ede35b8ea94a55ed3608408d67e102883129f1e" }
png = "0.18.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = "0.62.2"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
