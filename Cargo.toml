[workspace]
resolver = "3"
members = [
    "crates/fantermo",
    "crates/fantermo-bridge-protocol",
    "crates/fantermo-core",
    "crates/run-hidden",
]
# ブリッジは Cygwin と Linux 向けにだけビルドする（tools/bridge.sh）。
exclude = ["crates/fantermo-bridge"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
embed-resource = "3.0.12"
fantermo-bridge-protocol = { path = "crates/fantermo-bridge-protocol" }
fantermo-core = { path = "crates/fantermo-core" }
# `rev` を書き換えて上げる。そのコミットが求める Zig のバージョンは tools/dev.bat の ZIG_REQUIRED と揃える。
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "9ede35b8ea94a55ed3608408d67e102883129f1e", features = ["png"] }
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.2"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = "0.62.2"
windows-numerics = "0.3.1"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
